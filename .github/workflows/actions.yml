# https://github.com/julia-actions/cache#usage
name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:

# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

jobs:
  Test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: [1.13.2]         # 2026-10-14
        julia-arch: [x64]
        os: [ubuntu-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: julia-actions/setup-julia@v1
      with:
        version: ${{ matrix.julia-version }}
    - uses: julia-actions/cache@v1

    - name: Install jetls
      shell: bash
      run: |
        julia --startup-file=no -e '
          using Pkg
          Pkg.Apps.develop(; url="https://github.com/aviatesk/JETLS.jl")'
        echo "$HOME/.julia/bin" >> "$GITHUB_PATH"

    - uses: julia-actions/julia-buildpkg@v1

    - name: JETLS check
      run: |
        julia -e 'using Pkg; Pkg.add("Jive")'
        julia --startup-file=no --project=. -m JETLS check test/

    - uses: julia-actions/julia-runtest@v1
